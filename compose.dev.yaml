services:
  frontend:
    image: recap-frontend-dev
    build:
      target: development
    environment:
      API_INTERNAL_URL: http://api
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  frontend_node_modules:
  frontend_next:
